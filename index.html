addCards('rhetoric',[
 ['修辭作答公式','名稱 → 指出句中證據／本體喻體 → 說明突出甚麼特點或感情。以下屬通用練習，不代表校本只考這些種類。'],
 ['明喻','本體與喻體同現，常用像、如、彷彿連接，兩者有相似點。例：晚霞像一條橘紅色的絲帶。作用：形狀、色彩具體可感。'],
 ['暗喻','以是、成了等方式把一物說成另一物，重點是相似。例：書本是通往世界的窗。突出書本令人開闊眼界。'],
 ['擬人','非人的事物帶有人的動作、情態或思想。例：老榕樹張開手臂，迎接放學的孩子。增加親切感與生命力。'],
 ['誇張','有意放大或縮小，強調感受或特點，不追求精確數量。例：我等得脖子都長了一尺。突出等候焦急。'],
 ['排比','三項或以上結構相近、意思相關的語句連用。例：我要學會觀察，學會提問，學會查證。增強語勢和節奏。'],
 ['對偶','兩個字數相等、結構相近、意思相關的語句成對。例：晨風送花香，暮雨洗塵埃。形式整齊、節奏鮮明；嚴格對仗另有聲律要求。'],
 ['反復','有意重複詞語或句子以強調內容或情感。例：再試一次，再試一次，我總能找到答案。強調堅持及迫切。'],
 ['設問','為引起注意而提問，再回應。例：甚麼才是真正的勇氣？是明知困難仍願意嘗試。引起思考並引出要點。'],

function notes(){$('app').innerHTML=`<h1>分章重點</h1><p class="muted">先理解，再記憶。待補章節不計作已完成。</p><label>選擇章節<select id="chapter">${COURSE.chapters.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label><div id="chapterBody"></div>`;$('chapter').onchange=renderNotes;renderNotes()}
function renderNotes(){const c=COURSE.chapters.find(x=>x.id===$('chapter').value);$('chapterBody').innerHTML=`<section class="card"><span class="tag">${esc(c.kind)}</span><h2>${esc(c.title)}</h2><p>${esc(c.scope)}</p>${c.cards.length?`<div class="list">${c.cards.map(k=>`<details class="card"><summary>${esc(k.title)} · 展開重點</summary><p>${esc(k.body)}</p></details>`).join('')}</div><div class="actions"><button id="complete">${db.completed.includes(c.id)?'✓ 已閱重點（取消）':'標記重點已閱'}</button></div>`:'<div class="warning">待補本次教材。取得內容並核對後，才會加入重點卡和練習。</div>'}</section>`;if($('complete'))$('complete').onclick=()=>{db.completed=db.completed.includes(c.id)?db.completed.filter(x=>x!==c.id):[...db.completed,c.id];save();renderNotes()}}
function practice(wrong){const n=wrong?db.wrong.length:COURSE.questions.length;$('app').innerHTML=`<div class="quiz"><h1>${wrong?'錯題本':'分章練習'}</h1><p>每輪最多 10 題；選項會亂序。簡答按要點自評。</p><div class="card"><label>範圍<select id="chapter"><option value="all">全部已備範圍</option>${COURSE.chapters.map(c=>`<option value="${c.id}">${esc(c.title)}（${COURSE.questions.filter(q=>q.chapter===c.id).length} 題）</option>`).join('')}</select></label><p>${wrong?`目前 ${n} 道錯題。答對後移出錯題本，仍需兩次答對才算掌握。`:`目前 ${n} 道獨立題目；不重複填滿題數。`}</p><button class="primary" id="start">開始${wrong?'錯題重溫':'練習'}</button><p id="empty" role="status"></p></div></div>`;$('start').onclick=()=>{let qs=COURSE.questions.filter(q=>($('chapter').value==='all'||q.chapter===$('chapter').value)&&(!wrong||db.wrong.includes(q.id)));if(!wrong){const un=qs.filter(q=>(db.progress[q.id]||0)<2);if(un.length)qs=un}if(!qs.length){$('empty').textContent='這個範圍暫時沒有可練習的題目。';return}start(qs,10,false)}}
function exam(){$('app').innerHTML=`<div class="quiz"><h1>混合小測</h1><div class="card"><span class="tag">部分題庫 · 非完整模擬試卷</span><h2>25 分鐘，自定節奏。</h2><p>混合目前可用的名句、成語、修辭及材料分析題。每道只出一次；簡答自評另列，不納入客觀題分數。</p><p>目前 ${COURSE.questions.length} 道獨立題；選擇專項只有 ${COURSE.questions.filter(q=>q.type==='mc').length} 題，尚未達到 40 題。</p><div class="actions"><button id="mixed" class="primary">開始混合小測</button><button id="mc">選擇專項（實際題數）</button></div></div></div>`;$('mixed').onclick=()=>start(COURSE.questions,40,true);$('mc').onclick=()=>start(COURSE.questions.filter(q=>q.type==='mc'),40,true)}
function start(qs,n,examMode){session={queue:shuffle(qs).slice(0,n).map(q=>({...q,choices:q.options?shuffle(q.options.map((text,index)=>({text,index}))):[]})),at:0,answered:false,started:Date.now(),deadline:Date.now()+25*60*1000,exam:examMode,correct:0,objective:0,self:0,done:false};renderQuestion();if(examMode)timer=setInterval(()=>{if(Date.now()>=session.deadline)finish(true);else if($('clock'))$('clock').textContent=time(Math.ceil((session.deadline-Date.now())/1000))},1000)}
function time(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function renderQuestion(){const s=session;if(s.at>=s.queue.length){finish();return}s.answered=false;const q=s.queue[s.at];$('app').innerHTML=`<div class="quiz"><div class="row"><h1>${s.exam?'混合小測':'練習時間'}</h1>${s.exam?`<span class="timer tag" id="clock">${time(Math.ceil((s.deadline-Date.now())/1000))}</span>`:''}</div><p>第 ${s.at+1} / ${s.queue.length} 題 · ${q.type==='mc'?'選擇題':'簡答自評'} · ${q.status==='school-checked'?'依已提供校本':q.status==='verified-reference'?'原創參考練習':'原創示範'}</p><progress value="${s.at}" max="${s.queue.length}"></progress><section class="card"><h2>${esc(q.prompt)}</h2>${q.type==='mc'?q.choices.map((o,i)=>`<button class="option" data-choice="${o.index}">${'ABCD'[i]} · ${esc(o.text)}</button>`).join(''):'<label>寫下你的想法<textarea id="answer" placeholder="先試答，再核對要點"></textarea></label><button id="reveal">查看要點，自行評估</button>'}<div id="feedback" aria-live="polite"></div></section></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));if($('reveal'))$('reveal').onclick=()=>{if(!$('answer').value.trim()){notify('先寫下想法，再查看參考要點。');return}session.answered=true;$('answer').disabled=true;$('reveal').disabled=true;$('feedback').innerHTML=`<div class="feedback"><strong>參考答案 · 自評，不是自動評分</strong><p>${esc(q.answer)}</p><ul>${q.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p>${esc(q.explanation)}</p><div class="actions"><button id="selfYes">我已答到要點</button><button id="selfNo">需要再練</button></div></div>`;$('selfYes').onclick=()=>selfMark(true);$('selfNo').onclick=()=>selfMark(false)}}
function answer(a){if(session.answered)return;session.answered=true;const q=session.queue[session.at],ok=a===q.answer;session.objective++;if(ok)session.correct++;track(q.id,ok);document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q.answer)b.classList.add('correct');else if(Number(b.dataset.choice)===a)b.classList.add('incorrect')});feedback(q,ok)}
function selfMark(ok){session.self++;track(session.queue[session.at].id,ok);feedback(session.queue[session.at],ok,true)}
function feedback(q,ok,self=false){$('feedback').innerHTML=`<div class="feedback"><strong>${self?(ok?'自評：已答到要點':'自評：需要再練'):(ok?'答對了':'這題加入錯題本')}</strong><p>參考答案：${esc(q.type==='mc'?q.options[q.answer]:q.answer)}</p><p>${esc(q.explanation)}</p><details><summary>用廣東話再理解一次</summary><p>${esc(q.canto||q.explanation)}</p></details><div class="actions"><button id="next" class="primary">明白了 · ${session.at+1===session.queue.length?'完成本輪':'下一題 →'}</button></div></div>`;$('next').onclick=()=>{session.at++;renderQuestion()}}
function finish(expired=false){clearInterval(timer);const s=session;if(!s||s.done)return;s.done=true;const log={date:Date.now(),type:s.exam?'小測':'練習',total:s.queue.length,answered:s.objective+s.self,objective:s.objective,correct:s.correct,self:s.self,seconds:Math.round((Date.now()-s.started)/1000),expired};db.logs.unshift(log);db.logs=db.logs.slice(0,100);save();$('app').innerHTML=`<div class="quiz card"><span class="tag">${expired?'時間到':'本輪完成'}</span><h1>每一次練習，都有收穫。</h1><p>已作答 ${log.answered} / ${log.total} 題。</p><div class="metric">${log.correct} / ${log.objective} <small>已答客觀題答對</small></div><p>簡答自評 ${log.self} 題（不計入上述分數） · 用時 ${time(log.seconds)}</p><div class="actions"><button data-go="wrong">重溫錯題</button><button data-go="stats">學習記錄</button></div></div>`;actions()}
function recite(){$('app').innerHTML=`<h1>默寫練習</h1><p class="muted">閱讀全文 → 隱藏部分 → 只留句首 → 全部隱藏。請在紙上默寫，再自行核對。</p><div class="warning">參考版本，待學校教材核對。段落及「澈／徹」「佩／珮」等異體字以學校要求為準；本工具不作嚴格文字自動評分。</div><label>默寫範圍<select id="reciteSelect">${COURSE.recitations.map(r=>`<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select></label><section class="card"><p id="reciteNote"></p><div class="actions" id="levels">${['全文','隱藏部分','只留句首','全部隱藏'].map((l,i)=>`<button data-level="${i}">${l}</button>`).join('')}</div><div class="recitation" id="passage"></div><details><summary>補入／修改這個裝置的校本段落</summary><label>段落文字（僅儲存於本機）<textarea id="customText" maxlength="10000"></textarea></label><button id="saveText">儲存此段落</button><p class="muted">請勿加入姓名、學校等私隱資料。這些文字不會上傳。</p></details></section>`;$('reciteSelect').value=reciteId;$('reciteSelect').onchange=()=>{reciteId=$('reciteSelect').value;level=0;renderPassage()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);renderPassage()});$('saveText').onclick=()=>{db.recitations[reciteId]=$('customText').value;save();renderPassage();notify('段落已儲存於這個瀏覽器。')};renderPassage()}
function renderPassage(){const r=COURSE.recitations.find(x=>x.id===reciteId),text=db.recitations[reciteId]??r.text;$('reciteNote').textContent=r.note;$('customText').value=text;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('primary',Number(b.dataset.level)===level));let start=true;$('passage').innerHTML=text?Array.from(text).map((c,i)=>{const punctuation=/[\s，。；：！？、「」『』（）]/.test(c),hide=!punctuation&&(level===3||(level===2&&!start)||(level===1&&i%3!==0));if(!punctuation)start=false;if(/[。；！？\n]/.test(c))start=true;return hide?'<span class="hidden-char" aria-label="空格">　</span>':esc(c)}).join(''):'<p class="muted">這段文字尚待補充。可在下方填入已核對的學校版本。</p>'}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function stats(){$('app').innerHTML=`<h1>學習記錄</h1><p class="muted">只記錄這個瀏覽器。換裝置前先匯出備份；匯入只接受本語文站格式。</p><div class="actions"><button id="export">匯出進度 JSON</button><button id="csv">匯出成績 CSV</button><button id="print">列印／儲存 PDF</button></div><label>匯入進度備份<input type="file" id="import" accept=".json,application/json"></label><div class="grid"><div class="card"><div class="metric">${master()}</div>道題目已掌握</div><div class="card"><div class="metric">${db.wrong.length}</div>道錯題待重溫</div><div class="card"><div class="metric">${Math.round(db.logs.reduce((a,l)=>a+l.seconds,0)/60)}</div>分鐘已完成練習</div></div><h2>最近完成的練習</h2><div class="list">${db.logs.length?db.logs.map(l=>`<article class="card"><strong>${new Date(l.date).toLocaleString('zh-Hant')} · ${esc(l.type)}</strong><p>客觀題 ${l.correct}/${l.objective} · 自評 ${l.self} 題 · 已答 ${l.answered}/${l.total} · ${time(l.seconds)}</p></article>`).join(''):'<p>尚未完成練習。完成第一輪後會在這裏留下紀錄。</p>'}</div>`;$('export').onclick=()=>download('chinese-study-progress.json',JSON.stringify({app:KEY,data:db},null,2));$('csv').onclick=()=>download('chinese-study-results.csv','\uFEFF日期,類別,客觀答對,已答客觀題,自評題,已作答,總題數,秒數\n'+db.logs.map(l=>[new Date(l.date).toISOString(),l.type,l.correct,l.objective,l.self,l.answered,l.total,l.seconds].join(',')).join('\n'),'text/csv;charset=utf-8');$('print').onclick=()=>window.print();$('import').onchange=async()=>{try{const file=$('import').files[0];if(!file)return;if(file.size>1000000)throw Error();const x=JSON.parse(await file.text()),d=x.data,ids=new Set(COURSE.questions.map(q=>q.id));if(x.app!==KEY||d.version!==1||!d.progress||typeof d.progress!=='object'||!Array.isArray(d.wrong)||!Array.isArray(d.completed)||!Array.isArray(d.logs)||!d.recitations||typeof d.recitations!=='object'||d.logs.some(l=>!['date','total','answered','objective','correct','self','seconds'].every(k=>Number.isFinite(l[k])&&l[k]>=0)||!['練習','小測'].includes(l.type)))throw Error();if(!confirm('以備份取代這個瀏覽器的語文進度？'))return;db={version:1,progress:Object.fromEntries(Object.entries(d.progress).filter(([k,v])=>ids.has(k)&&Number.isInteger(v)&&v>=0)),wrong:[...new Set(d.wrong.filter(id=>ids.has(id)))],completed:[...new Set(d.completed.filter(id=>COURSE.chapters.some(c=>c.id===id&&c.cards.length)))],logs:d.logs.slice(0,100),recitations:Object.fromEntries(Object.entries(d.recitations).filter(([k,v])=>COURSE.recitations.some(r=>r.id===k)&&typeof v==='string'&&v.length<=10000))};save();stats();notify('已匯入語文進度。')}catch{notify('備份格式不符或檔案過大，原有進度未更改。')}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'home'));
go(['home','notes','recite','practice','wrong','exam','stats'].includes(location.hash.slice(1))?location.hash.slice(1):'home');


const originalRenderNotes=renderNotes;
renderNotes=function(){
 originalRenderNotes();
 if($('chapter').value==='culture'&&COURSE.culturePairs){
  $('chapterBody').insertAdjacentHTML('beforeend','<section class="card"><h2>作家與節日配對卡</h2><p>先回想，再翻卡核對。日期須連同農曆／公曆一起記。</p><div class="grid">'+COURSE.culturePairs.map(p=>'<details class="card"><summary>'+esc(p.left)+'</summary><p>'+esc(p.right)+'</p><small>校本講義第'+p.page+'頁</small></details>').join('')+'</div><button id="pairStart">抽5張，試試配對</button><div id="pairGame"></div></section>');
  $('pairStart').onclick=pairGame;
 }
 if(COURSE.sources)$('chapterBody').insertAdjacentHTML('beforeend','<details class="card"><summary>參考來源與版本說明</summary><p>研究資料核對日期：2026-10-20。古文是參考版本，未核校本；現代課文只提供原創摘要與練習，並非校方試題。文化PDF已讀文字，未核對頁圖。</p><ul>'+COURSE.sources.map(s=>'<li>'+(s.url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(s.url)+'">'+esc(s.title)+'</a>':esc(s.title))+'<p class="muted">'+esc(s.note||'')+'</p></li>').join('')+'</ul></details>');
};
function pairGame(){
 const cards=shuffle(COURSE.culturePairs).slice(0,5),options=shuffle(cards);
 $('pairGame').innerHTML=cards.map(p=>'<label>'+esc(p.left)+'<select data-pair="'+p.id+'"><option value="">請選擇配對</option>'+options.map(o=>'<option value="'+o.id+'">'+esc(o.right)+'</option>').join('')+'</select></label>').join('')+'<button id="checkPairs">核對配對</button><p id="pairFeedback" role="status"></p>';
 $('checkPairs').onclick=()=>{const selects=[...document.querySelectorAll('[data-pair]')];if(selects.some(x=>!x.value)){$('pairFeedback').textContent='請先完成全部配對。';return}const correct=selects.filter(x=>x.value===x.dataset.pair).length;$('pairFeedback').innerHTML='答對 '+correct+' / 5。'+cards.map(p=>'<p>'+esc(p.left)+' → '+esc(p.right)+'</p>').join('');selects.forEach(x=>x.disabled=true);$('checkPairs').disabled=true;};
}
