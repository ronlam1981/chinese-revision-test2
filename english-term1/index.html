<style>

tem-ui,sans-serif;font-size:.55em;letter-spacing:0;margin-top:14px}h2{font-size:24px;line-height:1.4;margin:0 0 14px}h3{font-size:18px;line-height:1.5;margin:0 0 10px}p{margin:10px 0}.sub,small{color:var(--sub)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}.hero .card{align-self:center;transform:rotate(2deg);box-shadow:0 14px 24px #173d4b0b}.label{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:2px}.metrics{display:flex;gap:20px;justify-content:space-between}.metric strong{font-size:34px;display:block;line-height:1.2}.metric small{font-size:12px}progress{accent-color:var(--blue);width:100%;height:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:14px}.quiz{max-width:780px;margin:auto}.question{font-size:23px;line-height:1.6;overflow-wrap:anywhere;margin:20px 0}.option{display:block;width:100%;text-align:left;margin:10px 0;min-height:54px}.option .letter{display:inline-block;border-radius:6px;background:#e7eded;padding:1px 9px;margin-right:12px;font-size:12px;color:var(--ink)}.selected{border:2px solid var(--blue);background:var(--light)}.correct{border:2px solid var(--success);background:#eaf5e9}.incorrect{border:2px solid var(--error);background:#fceeed}.feedback{padding:20px;border-radius:12px;background:#edf4ef;margin-top:20px;border-left:4px solid var(--success)}.feedback.bad{background:#fff0eb;border-color:var(--orange)}.feedback h3{margin-bottom:8px}.answer{font-size:20px;color:var(--ink)}label{display:block;margin:15px 0 6px}input,select,textarea{width:100%;background:white;border:1px solid #adbec4;border-radius:10px;padding:13px}textarea{resize:vertical;min-height:120px}.notice{padding:14px 18px;border-radius:12px;background:#fff3d9;border:1px solid #e8d6b1;font-size:14px;margin:16px 0}.listrow{padding:14px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.listrow:last-child{border:0}.listrow strong{display:inline-block;min-width:160px}.tag{font-size:12px;color:var(--sub);background:#eef0e9;padding:3px 9px;border-radius:12px}.timer{font-variant-numeric:tabular-nums;font-weight:650}.numbers{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}.numbers button{min-width:40px;min-height:40px;padding:4px}.numbers .done{background:#e1ece4}.numbers .current{border:2px solid var(--blue)}details{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:14px 18px;margin:12px 0}summary{cursor:pointer;font-weight:650}.review-answer{white-space:pre-wrap;overflow-wrap:anywhere}.chapterdone{display:flex;align-items:center;gap:8px;font-size:14px}.chapterdone input{width:auto}.empty{text-align:center;padding:45px 20px}.empty .big{font-size:45px}.score{font-size:50px;font-weight:700;line-height:1.2}.score small{font-size:20px}.checklist{padding-left:20px}.examtop{position:sticky;top:0;background:var(--paper);padding:10px 0;z-index:1}.print-only{display:none}.sheet{font-family:Georgia,"Microsoft JhengHei",serif}.sheet h2{margin-top:26px}.sheet li{margin:10px 0}.blank{display:inline-block;min-width:180px;border-bottom:1px solid #777}.write-lines{height:58px;border-bottom:1px solid #999;margin:7px 0}.matching{display:grid;grid-template-columns:1fr 1fr;gap:30px}.wordbank{padding:12px;background:#f1f2ec;border:1px solid var(--line);border-radius:8px}footer{padding:24px;text-align:center;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:10}#toast:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.hero{grid-template-columns:1fr;padding:25px;gap:12px}.hero .card{transform:none}.grid{grid-template-columns:1fr}.question{font-size:21px}}@media(max-width:440px){header{padding:18px}.brand strong{font-size:19px}.brand small{font-size:10px}.pill{font-size:10px}nav{padding:0 16px 16px}main{padding:8px 16px 35px}.card{padding:20px}.row{flex-wrap:wrap}.actions button{flex:1 1 auto}.matching{gap:15px;font-size:13px}.listrow strong{display:block}.hero{padding:22px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .16s ease-out}@keyframes appear{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}@media print{@page{size:A4;margin:16mm}body{background:white;color:black;font-size:11pt;line-height:1.5}header,nav,footer,button,.no-print,#toast,#storageWarning{display:none!important}main{max-width:none;padding:0;min-height:0}.sheet{display:block}.sheet h1{font-size:20pt}.sheet h2{font-size:14pt;break-after:avoid}.sheet li{break-inside:avoid;margin:9px 0}.print-only{display:block}.matching{grid-template-columns:1fr 1fr}.wordbank{background:white}.page-break{break-before:page}}

<body><header><a class="brand" href="#home"><span class="logo">W</span><span><strong>Word by Word</strong><small>TERM 1 · ENGLISH · REGULAR CLASS</small></span></a><span class="pill">進度只存本機</span></header><nav aria-label="主選單"><button data-view="home">學習總覽</button><button data-view="notes">重點溫習</button><button data-view="practice">分項練習</button><button data-view="wrong">錯題重溫</button><button data-view="exam">模擬測驗</button><button data-view="print">列印複習卷</button><button data-view="stats">學習記錄</button></nav><main id="app"></main><footer>依提供的 Text 1 · P.76–77 詞彙複習卷製作，共 45 題。答案與說明為輔助參考，並非學校官方答案。<br>毋須登入，沒有追蹤或上傳答案；進度只存在目前瀏覽器，不會跨裝置同步。中譯英採自行核對，不作自動語意判分。</footer><div id="toast" role="status"></div>
<script>
'use strict';
const VOCAB=[
['academically','學術上','副詞，用來講學業或學術方面的表現。'],['overwhelmed','壓得喘不過氣；不知所措','形容詞，be / feel overwhelmed 指事情太多而應付不來。'],['beneficial','有益的','形容詞，常用 beneficial to + 人／事物。'],['saturated fats','飽和脂肪','saturated 修飾 fats；這裏沿用教材複數寫法。'],['carbohydrate','碳水化合物','名詞，泛指這類營養素時亦常用 carbohydrates。'],['preservative','防腐劑','可數名詞，複數是 preservatives。'],['trigger','觸發；引發','動詞，例如 Stress can trigger headaches.'],['nutrient','營養素','可數名詞，複數是 nutrients。'],['boost','促進；增強','這裏作動詞，例如 boost your energy。'],['vitamin','維生素','可數名詞，複數是 vitamins。'],['protein','蛋白質','講營養時一般作不可數名詞。'],['dietary fiber','膳食纖維','fiber 是美式；fibre 是英式。兩者意思相同。'],['mineral','礦物質','可數名詞，講多種礦物質時用 minerals。'],['gobble','狼吞虎嚥','動詞，強調食得快、急。'],['wary','小心的；謹慎的','形容詞，常用 wary of + 名詞／動名詞。']];
const CONVERT=[
['flat',['apartment'],'英式 → 美式','flat（英）= apartment（美），指住宅單位。'],['lorry',['truck'],'英式 → 美式','lorry（英）= truck（美）。'],['tyre',['tire'],'英式 → 美式','車胎：tyre（英）／tire（美）。'],['colour',['color'],'英式 → 美式','美式 color 不含 u。'],['neighbour',['neighbor'],'英式 → 美式','美式 neighbor 不含 u。'],['fibre',['fiber'],'英式 → 美式','英式 -re 對應這個字的美式 -er。'],['programme',['program'],'英式 → 美式','一般節目／計劃：programme（英）／program（美）。電腦程式在英式也通常寫 program。'],["chemist’s",['pharmacy','drugstore','drug store'],'英式 → 美式','表示藥房時可用 pharmacy 或 drugstore；pharmacy 並非只限美式。'],['holiday',['vacation'],'英式 → 美式','指休假／度假時，holiday（英）相當於 vacation（美）；美式 holiday 也可指節日。'],['crisps',['chips','potato chips'],'英式 → 美式','薯片：crisps（英）／chips 或 potato chips（美）。英式 chips 通常指薯條。'],['apartment',['flat'],'美式 → 英式','住宅單位：apartment（美）／flat（英）。'],['truck',['lorry'],'美式 → 英式','truck（美）／lorry（英）。'],['candy',['sweets','sweet'],'美式 → 英式','糖果：candy（美）／sweets（英）；一粒糖果是 a sweet。'],['garbage',['rubbish'],'美式 → 英式','垃圾：garbage（美）／rubbish（英）。兩者在這裏是不可數名詞。'],['cookies',['biscuits'],'美式 → 英式','一般詞彙對照用 cookies（美）／biscuits（英）；英國亦會用 cookie 指某些曲奇。']];
const BANK=['beneficial','overwhelmed','boost','trigger','munch','sprinkle','preservative','antioxidant','symptom','alternative'];
const CLOZE=[
['Eating more fruit is ____________ to your health.',['beneficial'],'is 後用形容詞，beneficial to 表示「對……有益」。'],['Too much homework made her feel ____________.',['overwhelmed'],'feel 後用 overwhelmed，表示功課太多，令人不知所措。'],['Some food companies add ____________ to make food last longer.',['preservatives'],'一般說加入多種或不特定的防腐劑，用複數 preservatives。單數可數名詞不能在此裸用。'],['Stress can ____________ headaches.',['trigger'],'can 後面用動詞原形 trigger。'],['Oranges have ____________ which help protect our body.',['antioxidants'],'which help 配合複數先行詞 antioxidants，指抗氧化物。'],['If you have a fever, it is one ____________ of illness.',['symptom'],'one 後用單數可數名詞 symptom（症狀）。'],['You can ____________ some nuts on top of the salad.',['sprinkle'],'sprinkle 指撒上；can 後用動詞原形。'],['He likes to ____________ on carrots while watching TV.',['munch'],'munch on 指津津有味地咀嚼；to 後用動詞原形。'],['Exercise can ____________ your energy.',['boost'],'boost 指提升、增強；can 後用動詞原形。'],['There is no cheap ____________ for this medicine.',['alternative'],'這裏 alternative 是名詞，指替代品。也常見 an alternative to something 的搭配。']];
const TRANSLATE=[
['蛋白質對肌肉生長很重要。','Protein is important for muscle growth.',['Protein','be important for','muscle growth'],'亦可用 Protein is essential for muscle growth. 等意思相符而文法正確的句子。'],['膳食纖維幫助消化。','Dietary fibre helps digestion.',['Dietary fibre / dietary fiber','helps','digestion'],'fibre（英）與 fiber（美）皆可。Dietary fibre aids digestion. 亦可。'],['這種飲料不含防腐劑。','This drink does not contain preservatives.',['This drink','does not contain','preservatives'],'This drink contains no preservatives. 或 This drink is free from preservatives. 亦可。'],['我對陌生的食物保持謹慎。','I am wary of unfamiliar food.',['I am wary of','unfamiliar food'],'I am cautious about unfamiliar food. 亦可；wary of 是本課目標搭配。'],['太多飽和脂肪對心臟不好。','Too much saturated fat is bad for the heart.',['Too much saturated fat','is bad for','the heart'],'也可寫 Eating too much saturated fat is bad for your heart.；這裏 fat 作不可數名詞。']];
const CHAPTERS=[{id:'match',title:'中英配對',sub:'15 個核心詞彙',description:'認出意思，再連結詞性與常見搭配。',num:'01'},{id:'convert',title:'英美用字',sub:'15 題拼寫與說法',description:'分清英式、美式寫法與語境。',num:'02'},{id:'cloze',title:'詞性填空',sub:'10 題句子應用',description:'從單字庫揀選，留意單複數與詞性。',num:'03'},{id:'translate',title:'中譯英',sub:'5 題句子練習',description:'先自己寫，再對照參考答案自評。',num:'04'}];
const QUESTIONS=[...VOCAB.map((v,i)=>({id:'m'+i,chapter:'match',type:'mc',prompt:`「${v[0]}」的中文意思是甚麼？`,word:v[0],answer:v[1],explain:v[2],options:[v[1],...[3,7,11].map(n=>VOCAB[(i+n)%VOCAB.length][1])]})),...CONVERT.map((v,i)=>({id:'c'+i,chapter:'convert',type:'text',prompt:`${v[2]}：${v[0]} →`,answers:v[1],answer:v[1][0],explain:v[3]})),...CLOZE.map((v,i)=>({id:'f'+i,chapter:'cloze',type:'text',prompt:v[0],answers:v[1],answer:v[1][0],explain:v[2]})),...TRANSLATE.map((v,i)=>({id:'t'+i,chapter:'translate',type:'self',prompt:v[0],answer:v[1],points:v[2],explain:v[3]}))];
const KEY='word-by-word-term1-v1', DRAFTKEY=KEY+'-exam';
let canStore=true,state={progress:{},notes:{},exams:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.progress&&s.notes&&Array.isArray(s.exams))state=s;}catch(e){canStore=false;}
const app=document.querySelector('#app');let view='home',session=null,exam=null,result=null,timer=null,toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r};
const norm=s=>String(s||'').normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?。]+$/,'');
function isRight(q,a){return q.type==='mc'?a===q.answer:q.answers.some(v=>norm(v)===norm(a));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){canStore=false;}}
function record(q,ok){let p=state.progress[q.id]||{attempts:0,streak:0,wrong:false};p.attempts++;p.streak=ok?Math.min(2,p.streak+1):0;p.wrong=ok?(p.streak>=2?false:p.wrong):true;p.last=Date.now();state.progress[q.id]=p;save();}
function toast(t){document.querySelector('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4000);}
function numMastered(list=QUESTIONS){return list.filter(q=>(state.progress[q.id]?.streak||0)>=2).length;}
function wrongs(){return QUESTIONS.filter(q=>state.progress[q.id]?.wrong)}
function chapterName(id){return CHAPTERS.find(c=>c.id===id)?.title||'混合練習'}
function focusTop(){window.scrollTo({top:0,behavior:'instant'});app.setAttribute('tabindex','-1');app.focus({preventScroll:true});}
function shell(html){app.innerHTML=(!canStore?'<div class="notice" id="storageWarning">瀏覽器未能儲存進度。仍可練習，但離開後記錄可能消失。</div>':'')+html;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});}
function navigate(next){if(exam&&next!=='exam'&&!confirm('測驗尚未交卷。離開後可以繼續，但計時不會暫停。確定離開？'))return;session=null;view=next;render();focusTop();}
function render(){if(view==='home')home();else if(view==='notes')notes();else if(view==='practice')practiceMenu();else if(view==='wrong')wrongMenu();else if(view==='exam')exam?examQuestion():examMenu();else if(view==='result')showResult();else if(view==='print')printMenu();else if(view==='stats')stats();}
function home(){shell(`<section class="hero"><div><div class="eyebrow">Text 1 · P.76–77</div><h1>A little practice.<br>A stronger vocabulary.<span>每日一點，逐個字掌握。</span></h1><p class="sub">由認字到造句，一步步溫習 Term 1 英文詞彙。<br>答錯唔緊要，理解之後再試。</p><div class="actions"><button class="primary" data-action="quick">開始 10 題練習 →</button><button data-view="notes">先溫重點</button></div></div><div class="card"><div class="label">YOUR PROGRESS</div><h3 style="margin-top:12px">慢慢累積，睇到進步。</h3><div class="metrics"><div class="metric"><strong>${numMastered()}<small> / 45</small></strong><small>已掌握</small></div><div class="metric"><strong>${wrongs().length}</strong><small>待重溫</small></div></div><progress value="${numMastered()}" max="45" aria-label="已掌握題目"></progress><small>同一題連續答對兩次才算掌握。<br>翻譯題按你核對後的自評記錄。</small></div></section><section class="grid">${CHAPTERS.map(c=>`<article class="card"><span class="label">${c.num} · ${c.sub}</span><h2 style="margin-top:10px">${c.title}</h2><p class="sub">${c.description}</p><div class="row"><small>已掌握 ${numMastered(QUESTIONS.filter(q=>q.chapter===c.id))} / ${QUESTIONS.filter(q=>q.chapter===c.id).length}</small><button data-action="chapter" data-chapter="${c.id}">練習 →</button></div></article>`).join('')}</section><p class="sub">40 題可自動核對，5 題翻譯自行核對。答案只供複習參考，以老師要求為準。</p>`);}
function notes(){
let content=CHAPTERS.map(c=>{
let rows='';
if(c.id==='match')rows=VOCAB.map(v=>`<div class="listrow"><strong>${v[0]}</strong> ${v[1]}<div class="sub">${v[2]}</div></div>`).join('');
else if(c.id==='convert')rows=CONVERT.map(v=>`<div class="listrow"><strong>${v[0]} → ${v[1].join(' / ')}</strong><span class="tag">${v[2]}</span><div class="sub">${v[3]}</div></div>`).join('');
else if(c.id==='cloze')rows=`<div class="wordbank">${BANK.join(' · ')}</div>`+CLOZE.map(v=>`<div class="listrow">${esc(v[0]).replace('____________','<strong>'+v[1][0]+'</strong>')}<div class="sub">${v[2]}</div></div>`).join('');
else rows=TRANSLATE.map(v=>`<div class="listrow"><p>${v[0]}</p><strong>${v[1]}</strong><div class="sub">${v[3]}</div></div>`).join('');
return `<details ${c.id==='match'?'open':''}><summary>${c.num}　${c.title}</summary>${rows}<label class="chapterdone"><input type="checkbox" data-note="${c.id}" ${state.notes[c.id]?'checked':''}>我已溫習這一部分</label><button data-action="chapter" data-chapter="${c.id}">練習這部分 →</button></details>`;
}).join('');shell(`<h2>重點溫習</h2><p class="sub">先睇意思與用法，再測試自己。完成標記同答題進度分開記錄。</p>${content}`);
}
function practiceMenu(){shell(`<div class="quiz"><h2>分項練習</h2><p class="sub">每輪最多 10 題，答案與解析即時顯示。錯題會在本輪稍後再出現；連續答對兩次才算掌握。</p><div class="card"><label for="category">選擇範圍</label><select id="category"><option value="all">四部分混合</option>${CHAPTERS.map(c=>`<option value="${c.id}">${c.title}</option>`).join('')}</select><div class="actions"><button class="primary" data-action="startPractice">開始練習</button></div></div></div>`);}
function wrongMenu(){let qs=wrongs();shell(`<div class="quiz"><h2>錯題重溫</h2><p class="sub">答錯或翻譯自評「再練習」的題目會放在這裏。連續答對兩次後移出。</p>${qs.length?`<div class="card"><h3>${qs.length} 題等你再挑戰</h3><button class="primary" data-action="wrongStart">重練錯題 →</button>${qs.map(q=>`<div class="listrow"><span class="tag">${chapterName(q.chapter)}</span><p>${esc(q.prompt)}</p><small>連續答對 ${state.progress[q.id]?.streak||0} / 2</small></div>`).join('')}</div>`:`<div class="card empty"><div class="big">✓</div><h3>暫時沒有錯題</h3><p class="sub">開始一輪練習，測試自己記得幾多。</p><button data-action="quick">練習 10 題</button></div>`}</div>`);}
function startPractice(chapter='all',wrongOnly=false){let pool=wrongOnly?wrongs():QUESTIONS.filter(q=>chapter==='all'||q.chapter===chapter);if(!pool.length){toast('暫時沒有題目。');return}session={queue:shuffle(pool).slice(0,10),index:0,total:0,correct:0,wrongOnly,answered:false,options:null,feedback:null};view=wrongOnly?'wrong':'practice';practiceQuestion();focusTop();}
function practiceQuestion(){if(!session)return;if(session.index>=session.queue.length){shell(`<div class="quiz card empty"><div class="label">SESSION COMPLETE</div><h2>這一輪完成了！</h2><div class="score">${session.correct}<small> / ${session.total} 次答對</small></div><p class="sub">包括本輪重試次數。掌握度已儲存。</p><div class="actions"><button class="primary" data-action="quick">再練 10 題</button><button data-view="wrong">睇錯題本</button><button data-view="home">返回總覽</button></div></div>`);return}const q=session.queue[session.index];session.answered=false;session.feedback=null;session.options=q.type==='mc'?shuffle(q.options):null;shell(`<div class="quiz"><div class="row"><span class="tag">${chapterName(q.chapter)}</span><small>第 ${session.index+1} 題 · 本輪剩餘 ${session.queue.length-session.index}</small></div><div class="card"><div class="question">${esc(q.prompt)}</div>${q.chapter==='cloze'?`<details><summary>查看單字庫</summary><p>${BANK.join(' · ')}</p></details>`:''}<div id="answerArea">${q.type==='mc'?session.options.map((o,i)=>`<button class="option" data-action="practiceMC" data-index="${i}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join(''):`<form id="practiceForm"><label for="practiceAnswer" class="sr-only">你的答案</label>${q.type==='self'?'<textarea id="practiceAnswer" placeholder="先試寫完整英文句子，再對答案。" autocomplete="off" spellcheck="false"></textarea>':'<input id="practiceAnswer" placeholder="輸入英文答案" autocomplete="off" autocapitalize="off" spellcheck="false">'}<div class="actions"><button class="primary" type="submit">${q.type==='self'?'查看參考答案':'核對答案'}</button></div></form>`}</div><div id="feedback" aria-live="polite"></div></div><p class="sub">${q.type==='self'?'翻譯可以有不同寫法，不會因為與參考答案不一樣就自動判錯。':'單字答案忽略大小寫、前後空格及句尾句號，但仍會核對拼寫及指定單複數。'}</p></div>`);}
function practiceAnswer(value){if(!session||session.answered)return;const q=session.queue[session.index];if(!String(value).trim()){toast('請先試答，再核對。');return}session.answered=true;document.querySelectorAll('#answerArea button,#answerArea input,#answerArea textarea').forEach(e=>e.disabled=true);if(q.type==='self'){document.querySelector('#feedback').innerHTML=`<div class="feedback"><h3>參考答案 · 請自行核對</h3><p class="answer">${esc(q.answer)}</p><ul>${q.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p>${esc(q.explain)}</p><p class="sub">意思完整、文法正確的其他寫法亦可。以下是自評，不是自動判分。</p><div class="actions"><button class="primary" data-action="selfYes">我核對後答對</button><button data-action="selfNo">需要再練習</button></div></div>`;return}const ok=isRight(q,value);if(q.type==='mc')document.querySelectorAll('[data-action="practiceMC"]').forEach((b,i)=>{if(session.options[i]===q.answer)b.classList.add('correct');else if(session.options[i]===value)b.classList.add('incorrect')});finishPractice(q,ok);}
function finishPractice(q,ok){if(session.feedback!==null)return;session.feedback=ok;record(q,ok);session.total++;if(ok)session.correct++;if(!ok||(session.wrongOnly&&(state.progress[q.id]?.streak||0)<2))session.queue.push(q);document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><h3>${q.type==='self'?(ok?'已記錄：自評答對':'已記錄：需要再練習'):(ok?'✓ 答啱了！':'再睇一次，記住用法。')}</h3><p class="answer">${q.type==='self'?'參考答案':'答案'}：${esc(q.answers?q.answers.join(' / '):q.answer)}</p><p>${esc(q.explain)}</p><small>連續答對 ${state.progress[q.id]?.streak||0} / 2 ${state.progress[q.id]?.streak>=2?'· 已掌握':''}</small><div class="actions"><button class="primary" data-action="nextPractice">明白了，繼續 →</button></div></div>`;}
function getDraft(){try{let d=JSON.parse(localStorage.getItem(DRAFTKEY)||'null');if(d&&Array.isArray(d.ids)&&d.ids.length===45&&new Set(d.ids).size===45&&d.ids.every(id=>QUESTIONS.some(q=>q.id===id))&&d.answers&&Number.isFinite(d.started)&&Number.isFinite(d.deadline))return d}catch(e){}return null}
function saveDraft(){try{localStorage.setItem(DRAFTKEY,JSON.stringify(exam))}catch(e){canStore=false;}}
function examMenu(){const d=getDraft();shell(`<div class="quiz"><h2>模擬測驗</h2><div class="card"><div class="label">45 QUESTIONS · 30 MINUTES</div><h3 style="margin-top:12px">試下唔睇答案，獨立完成。</h3><ul><li>中英配對 15 題、英美用字 15 題、詞性填空 10 題。</li><li>中譯英 5 題另外自行核對，不計入自動分數。</li><li>交卷後先顯示答案。題目與選項會打亂。</li><li>30 分鐘到時自動交卷；離開頁面不會暫停計時。</li></ul>${d?'<div class="notice">有一份未交卷的測驗。你可以繼續，或放棄後重新開始。</div><div class="actions"><button class="primary" data-action="resumeExam">繼續測驗</button><button data-action="discardExam">放棄舊卷並重開</button></div>':'<div class="actions"><button class="primary" data-action="newExam">開始 30 分鐘測驗 →</button></div>'}</div></div>`);}
function newExam(){exam={ids:shuffle(QUESTIONS).map(q=>q.id),answers:{},options:{},index:0,started:Date.now(),deadline:Date.now()+30*60*1000};QUESTIONS.filter(q=>q.type==='mc').forEach(q=>exam.options[q.id]=shuffle(q.options));saveDraft();view='exam';runTimer();examQuestion();focusTop();}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{if(!exam)return;const left=Math.max(0,exam.deadline-Date.now());const e=document.querySelector('#timer');if(e)e.textContent=formatTime(left);if(left<=0)submitExam(true)},1000);}
function formatTime(ms){const sec=Math.ceil(ms/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function examQuestion(){if(!exam)return;const q=QUESTIONS.find(x=>x.id===exam.ids[exam.index]);if(!q)return;let value=exam.answers[q.id]||'';shell(`<div class="quiz"><div class="examtop row"><span class="tag">模擬測驗 · ${exam.index+1} / 45</span><span class="timer" id="timer" aria-label="剩餘時間">${formatTime(Math.max(0,exam.deadline-Date.now()))}</span></div><progress value="${Object.values(exam.answers).filter(x=>String(x).trim()).length}" max="45" aria-label="已作答題目"></progress><div class="card"><span class="label">${chapterName(q.chapter)}</span><div class="question">${esc(q.prompt)}</div>${q.chapter==='cloze'?`<div class="wordbank">單字庫：${BANK.join(' · ')}</div>`:''}${q.type==='mc'?(exam.options[q.id]||q.options).map((o,i)=>`<button class="option ${value===o?'selected':''}" aria-pressed="${value===o}" data-action="examMC" data-index="${i}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join(''):`<label for="examAnswer">你的答案${q.type==='self'?'（交卷後自行核對）':''}</label>${q.type==='self'?`<textarea id="examAnswer" spellcheck="false" autocomplete="off">${esc(value)}</textarea>`:`<input id="examAnswer" value="${esc(value)}" spellcheck="false" autocomplete="off" autocapitalize="off">`}`}<div class="actions"><button data-action="examPrev" ${exam.index===0?'disabled':''}>← 上一題</button><button class="primary" data-action="examNext" ${exam.index===44?'disabled':''}>下一題 →</button></div></div><div class="numbers" aria-label="跳到題目">${exam.ids.map((id,i)=>`<button class="${String(exam.answers[id]||'').trim()?'done':''} ${i===exam.index?'current':''}" data-action="jumpExam" data-index="${i}" aria-label="第 ${i+1} 題${String(exam.answers[id]||'').trim()?'，已作答':''}">${i+1}</button>`).join('')}</div><div class="actions"><button data-action="submitExam">交卷及查看結果</button></div><p class="sub">有底色表示已作答。答案儲存在本機；重新開啟可繼續。</p></div>`);}
function captureExam(){if(!exam)return;let input=document.querySelector('#examAnswer');if(input)exam.answers[exam.ids[exam.index]]=input.value;saveDraft();}
function submitExam(timed=false){if(!exam)return;captureExam();let missing=exam.ids.filter(id=>!String(exam.answers[id]||'').trim()).length;if(!timed&&!confirm(`確定交卷？${missing?'尚有 '+missing+' 題未作答。':''}`))return;clearInterval(timer);const saved=exam;exam=null;const list=saved.ids.map(id=>QUESTIONS.find(q=>q.id===id));let score=0;for(const q of list.filter(q=>q.type!=='self')){const ok=isRight(q,saved.answers[q.id]||'');if(ok)score++;record(q,ok)}result={id:'exam-'+saved.started,date:Date.now(),answers:saved.answers,ids:saved.ids,score,total:40,duration:Math.min(30*60,Math.round((Date.now()-saved.started)/1000)),timed,self:{}};state.exams.unshift(result);state.exams=state.exams.slice(0,10);save();try{localStorage.removeItem(DRAFTKEY)}catch(e){}view='result';showResult();focusTop();}
function showResult(){if(!result){view='stats';stats();return}shell(`<div class="quiz"><div class="card"><div class="label">${result.timed?'TIME IS UP':'EXAM COMPLETE'}</div><h2 style="margin-top:12px">測驗結果</h2><div class="score">${result.score}<small> / 40</small></div><p>自動核對部分：${Math.round(result.score/40*100)}% · 用時 ${formatTime(result.duration*1000)}</p><div class="notice">5 題翻譯另行自評，不計入以上分數。未作答的客觀題按錯題記錄。</div><div class="actions"><button data-view="wrong">重溫錯題</button><button data-view="exam">再試一次</button><button data-action="printResults">列印這份結果</button></div></div>${result.ids.map((id,i)=>{const q=QUESTIONS.find(q=>q.id===id),a=result.answers[id]||'',ok=q.type==='self'?null:isRight(q,a);return `<details ${q.type==='self'?'open':''}><summary>${i+1}. ${q.type==='self'?'自行核對':ok?'✓ 正確':'待重溫'} · ${chapterName(q.chapter)}</summary><p>${esc(q.prompt)}</p><p class="review-answer">你的答案：${esc(a)||'（未作答）'}</p><p><strong>${q.type==='self'?'參考答案':'答案'}：</strong>${esc(q.answers?q.answers.join(' / '):q.answer)}</p><p class="sub">${esc(q.explain)}</p>${q.type==='self'?`<ul>${q.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${Object.hasOwn(result.self||{},id)?`<p class="tag">已記錄自評：${result.self[id]?'答對':'需要再練習'}</p>`:`<div class="actions"><button data-action="resultSelf" data-id="${id}" data-ok="yes" ${a.trim()?'':'disabled'}>我核對後答對</button><button data-action="resultSelf" data-id="${id}" data-ok="no">需要再練習</button></div>`}`:''}</details>`}).join('')}</div>`);}
function stats(){shell(`<div class="quiz"><h2>學習記錄</h2><div class="card"><div class="metrics"><div class="metric"><strong>${numMastered()} / 45</strong><small>已掌握（含翻譯自評）</small></div><div class="metric"><strong>${wrongs().length}</strong><small>待重溫</small></div></div><progress value="${numMastered()}" max="45"></progress>${CHAPTERS.map(c=>`<div class="listrow row"><span>${c.title}</span><span>${numMastered(QUESTIONS.filter(q=>q.chapter===c.id))} / ${QUESTIONS.filter(q=>q.chapter===c.id).length}</span></div>`).join('')}</div><h3 style="margin-top:24px">最近 10 次測驗</h3>${state.exams.length?state.exams.map((r,i)=>`<div class="card row" style="margin-top:12px"><div><strong>${r.score} / 40</strong><p class="sub">${new Date(r.date).toLocaleString('zh-Hant',{timeZone:'Asia/Macau'})}（澳門時間）</p></div><button data-action="openResult" data-index="${i}">查看</button></div>`).join(''):'<p class="sub">尚未完成模擬測驗。</p>'}<details style="margin-top:28px"><summary>進度管理</summary><p class="sub">清除後無法復原，只影響目前瀏覽器的本站記錄。</p><button data-action="reset">清除所有學習記錄</button></details></div>`);}
function printMenu(){shell(`<div class="no-print"><h2>列印複習卷</h2><p class="sub">可用瀏覽器「列印／另存 PDF」。不含答案版適合手寫練習。</p><div class="actions"><button class="primary" data-action="printBlank">列印空白卷</button><button data-action="printAnswers">列印參考答案</button></div><div class="notice">預覽是空白卷，保留原來四部分與 45 題。中英配對 B 欄順序與提供的複習卷一致。</div></div><div id="sheetArea">${blankSheet()}</div>`);}
function blankSheet(){const order=[2,9,4,12,0,3,7,10,5,6,1,11,13,8,14];return `<article class="sheet"><h1>Term 1 – English Exam</h1><p>Regular Class · Text 1 | P.76–77<br>詞彙複習卷（空白版）</p><p>姓名：________________　班別：________　日期：________</p><h2>第一部分：中英配對</h2><div class="matching"><div><strong>A 欄</strong><ol>${VOCAB.map(v=>`<li>${v[0]}</li>`).join('')}</ol></div><div><strong>B 欄</strong><ol style="list-style:none;padding:0">${order.map(i=>`<li>(　　) ${VOCAB[i][1]}</li>`).join('')}</ol></div></div><h2>第二部分：英美用字轉換</h2><p>寫出另一種拼寫／說法。</p><h3>英式 → 美式</h3><ol>${CONVERT.slice(0,10).map(v=>`<li>${v[0]} → <span class="blank">&nbsp;</span></li>`).join('')}</ol><h3>美式 → 英式</h3><ol start="11">${CONVERT.slice(10).map(v=>`<li>${v[0]} → <span class="blank">&nbsp;</span></li>`).join('')}</ol><h2>第三部分：詞性填空</h2><p>從單字庫揀選，可按語法變形。</p><div class="wordbank">${BANK.join(', ')}</div><ol>${CLOZE.map(v=>`<li>${esc(v[0])}</li>`).join('')}</ol><h2>第四部分：中譯英</h2><ol>${TRANSLATE.map(v=>`<li>${v[0]}<div class="write-lines"></div></li>`).join('')}</ol></article>`;}
function answerSheet(){return `<article class="sheet"><h1>Term 1 – English｜參考答案</h1><p>Text 1 · P.76–77 · 輔助複習，非學校官方答案。</p><h2>第一部分：中英配對</h2><p>B 欄由上至下：3、10、5、13、1、4、8、11、6、7、2、12、14、9、15。</p><h2>第二部分：英美用字轉換</h2><ol>${CONVERT.map(v=>`<li>${v[0]} → <strong>${v[1].join(' / ')}</strong><br><small>${v[3]}</small></li>`).join('')}</ol><h2>第三部分：詞性填空</h2><ol>${CLOZE.map(v=>`<li><strong>${v[1][0]}</strong> — ${v[2]}</li>`).join('')}</ol><h2>第四部分：中譯英</h2><p>翻譯不只一種答案；意思相符、文法正確的寫法亦可。</p><ol>${TRANSLATE.map(v=>`<li>${v[0]}<br><strong>${v[1]}</strong><br><small>${v[3]}</small></li>`).join('')}</ol></article>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){navigate(b.dataset.view);return}const a=b.dataset.action;if(a==='quick')startPractice();else if(a==='chapter')startPractice(b.dataset.chapter);else if(a==='startPractice')startPractice(document.querySelector('#category').value);else if(a==='wrongStart')startPractice('all',true);else if(a==='practiceMC')practiceAnswer(session.options[Number(b.dataset.index)]);else if(a==='selfYes'||a==='selfNo')finishPractice(session.queue[session.index],a==='selfYes');else if(a==='nextPractice'){session.index++;practiceQuestion();focusTop()}else if(a==='newExam')newExam();else if(a==='resumeExam'){exam=getDraft();if(exam){view='exam';runTimer();if(exam.deadline<=Date.now())submitExam(true);else examQuestion()}}else if(a==='discardExam'){if(confirm('放棄未交卷的答案並開始新測驗？'))newExam()}else if(a==='examMC'){const q=QUESTIONS.find(q=>q.id===exam.ids[exam.index]);exam.answers[q.id]=(exam.options[q.id]||q.options)[Number(b.dataset.index)];saveDraft();examQuestion()}else if(a==='examNext'||a==='examPrev'||a==='jumpExam'){captureExam();exam.index=a==='jumpExam'?Number(b.dataset.index):Math.max(0,Math.min(44,exam.index+(a==='examNext'?1:-1)));saveDraft();examQuestion();focusTop()}else if(a==='submitExam')submitExam();else if(a==='openResult'){result=state.exams[Number(b.dataset.index)];view='result';showResult();focusTop()}else if(a==='resultSelf'){if(Object.hasOwn(result.self,b.dataset.id))return;const q=QUESTIONS.find(q=>q.id===b.dataset.id);result.self[q.id]=b.dataset.ok==='yes';record(q,result.self[q.id]);save();showResult()}else if(a==='reset'){if(confirm('確定清除所有練習、錯題及測驗記錄？此動作不能復原。')){state={progress:{},notes:{},exams:[]};save();try{localStorage.removeItem(DRAFTKEY)}catch(e){}exam=null;clearInterval(timer);stats();toast('學習記錄已清除。')}}else if(a==='printBlank'||a==='printAnswers'){document.querySelector('#sheetArea').innerHTML=a==='printAnswers'?answerSheet():blankSheet();window.print()}else if(a==='printResults'){document.querySelectorAll('details').forEach(d=>d.open=true);window.print()}});
document.addEventListener('submit',e=>{if(e.target.id==='practiceForm'){e.preventDefault();practiceAnswer(document.querySelector('#practiceAnswer').value)}});
document.addEventListener('change',e=>{if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.checked;save()}});
document.addEventListener('input',e=>{if(e.target.id==='examAnswer')captureExam()});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();navigate('home')});
window.addEventListener('beforeunload',()=>{if(exam)captureExam()});
render();
</script>
</body></html>
